name: internal secure multichain gate binary

on:
  pull_request:
    branches:
      - internal/secure-gate-bin-base-20260803
    paths:
      - "internal-secure-request/**"

permissions:
  contents: read

concurrency:
  group: internal-secure-gate-bin-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout isolated request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Generate one-time runner certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handshake-public
          umask 077
          openssl req -x509 -newkey rsa:4096 -sha256 -nodes -days 1 \
            -subj '/CN=ephemeral-secure-multichain-binary-runner' \
            -keyout /tmp/runner-private.pem \
            -out handshake-public/runner-certificate.pem \
            >/dev/null 2>&1
          openssl x509 -in handshake-public/runner-certificate.pem -noout -fingerprint -sha256 \
            > handshake-public/runner-certificate.sha256-fingerprint.txt
          printf '%s\n' "$GITHUB_RUN_ID" > handshake-public/run-id.txt
          chmod 600 /tmp/runner-private.pem
          chmod 644 handshake-public/*

      - name: Publish one-time certificate
        uses: actions/upload-artifact@v4
        with:
          name: secure-gate-bin-handshake-${{ github.run_id }}
          path: handshake-public/
          if-no-files-found: error
          retention-days: 1

      - name: Retrieve run-bound binary CMS payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/secure-gate-transport
          mkdir -p /tmp/secure-gate-transport
          found=0
          for attempt in $(seq 1 600); do
            rm -rf /tmp/secure-gate-transport/repo
            git clone --quiet --depth 1 --branch internal/secure-gate-bin-payload-20260803 \
              https://github.com/zerodaybugs/sorozatszam-app.git /tmp/secure-gate-transport/repo 2>/dev/null || true
            payload_dir=/tmp/secure-gate-transport/repo/internal-secure-payload
            if test -s "$payload_dir/payload.cms" \
               && test -s "$payload_dir/payload.cms.sha256" \
               && test -s "$payload_dir/run-id.txt" \
               && test "$(tr -d '\r\n' < "$payload_dir/run-id.txt")" = "$GITHUB_RUN_ID"; then
              cp "$payload_dir/payload.cms" /tmp/secure-gate-transport/
              cp "$payload_dir/payload.cms.sha256" /tmp/secure-gate-transport/
              cp "$payload_dir/run-id.txt" /tmp/secure-gate-transport/
              if (cd /tmp/secure-gate-transport && sha256sum --check --strict payload.cms.sha256); then
                found=1
                break
              fi
            fi
            sleep 4
          done
          test "$found" -eq 1
          test "$(tr -d '\r\n' < /tmp/secure-gate-transport/run-id.txt)" = "$GITHUB_RUN_ID"
          (cd /tmp/secure-gate-transport && sha256sum --check --strict payload.cms.sha256)

      - name: Decrypt, verify, and execute local-only proof
        id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rm -rf /tmp/secure-gate-work
          mkdir -p /tmp/secure-gate-work/lib encrypted-result
          openssl cms -decrypt -binary -inform DER \
            -in /tmp/secure-gate-transport/payload.cms \
            -recip handshake-public/runner-certificate.pem \
            -inkey /tmp/runner-private.pem \
            -out /tmp/secure-gate-payload.tar.gz \
            >/dev/null 2>&1
          tar -xzf /tmp/secure-gate-payload.tar.gz -C /tmp/secure-gate-work
          (cd /tmp/secure-gate-work && sha256sum --check --strict INPUT_SHA256SUMS)
          git clone --quiet --depth 1 --branch v1.9.6 \
            https://github.com/foundry-rs/forge-std.git /tmp/secure-gate-work/lib/forge-std
          curl -fsSL --retry 4 --retry-all-errors \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.29+commit.ab55807c' \
            -o /tmp/secure-gate-work/solc
          echo '18d418a40dc04d17656b1b5c8a7b35cfbab8942b51f38d005d5b59e8aa6637e0  /tmp/secure-gate-work/solc' \
            | sha256sum --check --strict >/dev/null
          chmod 0755 /tmp/secure-gate-work/solc /tmp/secure-gate-work/RUN.sh
          set +e
          (cd /tmp/secure-gate-work && ./RUN.sh)
          run_status=$?
          set -e
          mkdir -p /tmp/secure-gate-work/evidence
          printf '%s\n' "$run_status" > /tmp/secure-gate-work/evidence/RUNNER_EXIT_STATUS.txt
          forge --version > /tmp/secure-gate-work/evidence/WORKFLOW_FORGE_VERSION.txt 2>&1
          /tmp/secure-gate-work/solc --version > /tmp/secure-gate-work/evidence/WORKFLOW_SOLC_VERSION.txt 2>&1
          (cd /tmp/secure-gate-work/evidence && \
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit "$run_status"

      - name: Encrypt evidence to researcher certificate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-result
          if [[ ! -d /tmp/secure-gate-work/evidence ]]; then
            mkdir -p /tmp/secure-gate-work/evidence
            printf 'proof-step-did-not-produce-evidence\n' > /tmp/secure-gate-work/evidence/TRANSPORT_ERROR.txt
            printf '99\n' > /tmp/secure-gate-work/evidence/RUNNER_EXIT_STATUS.txt
          fi
          if [[ -s /tmp/secure-gate-work/researcher-certificate.pem ]]; then
            tar -czf /tmp/secure-gate-evidence.tar.gz -C /tmp/secure-gate-work evidence
            openssl cms -encrypt -binary -aes-256-cbc -outform DER \
              -in /tmp/secure-gate-evidence.tar.gz \
              -out encrypted-result/evidence.cms \
              /tmp/secure-gate-work/researcher-certificate.pem \
              >/dev/null 2>&1
            sha256sum encrypted-result/evidence.cms > encrypted-result/evidence.cms.sha256
          else
            printf 'researcher-certificate-unavailable-before-payload-decryption\n' > encrypted-result/TRANSPORT_STATUS.txt
          fi
          cp /tmp/secure-gate-work/evidence/RUNNER_EXIT_STATUS.txt encrypted-result/
          printf 'evidence-packaging-complete\n' > encrypted-result/STATUS.txt
          shred -u /tmp/runner-private.pem /tmp/secure-gate-payload.tar.gz /tmp/secure-gate-evidence.tar.gz 2>/dev/null || true
          rm -rf /tmp/secure-gate-work /tmp/secure-gate-transport

      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-gate-bin-result-${{ github.run_id }}
          path: encrypted-result/
          if-no-files-found: error
          retention-days: 1

      - name: Enforce proof result after artifact upload
        if: always()
        shell: bash
        run: test "$(cat encrypted-result/RUNNER_EXIT_STATUS.txt 2>/dev/null || echo 99)" = 0
